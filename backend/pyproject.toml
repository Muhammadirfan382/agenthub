# Tool configuration for the AgentHub backend.
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[project]
name = "agenthub-backend"
version = "0.1.0"
description = "AgentHub backend API (Phase 0 foundation)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
# Directories that contain first-party packages (`app`, `tests`).
src = ["."]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Plain `assert` is the pytest idiom; S105/S106 flag the throwaway passwords
# that these tests must contain to exercise authentication at all.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
