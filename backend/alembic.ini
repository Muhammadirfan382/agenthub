# Alembic configuration. Run from the backend directory:
#   .venv/Scripts/python.exe -m alembic upgrade head
#
# Migrations live in database/migrations so the repository keeps one obvious
# home for schema history. The database URL comes from application settings
# (DATABASE_URL); it is never written here.
[alembic]
script_location = ../database/migrations
prepend_sys_path = .
path_separator = os
