# Weekly proposals for dependency and pinned-action updates. Each arrives as a
# pull request that CI - including the security job - must pass before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images, pinned by digest in the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /infrastructure/docker
      - /agents/sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The PostgreSQL and Prometheus images pinned in the compose file.
  - package-ecosystem: docker-compose
    directory: /infrastructure/deployment
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
