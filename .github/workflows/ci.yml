name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agenthub
          # Throwaway value for an ephemeral CI container that is never exposed
          # outside this job. Not a secret and not used anywhere else.
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://agenthub:ci_local_only@127.0.0.1:5432/agenthub
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      # Fails if the models have drifted away from the migrations.
      - name: Check for un-migrated model changes
        run: python -m alembic check

      - name: Check the migration can be rolled back and reapplied
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      # Output is discarded: the seed prints generated demo passwords, and CI
      # logs are not a place for credentials even throwaway ones. A failure
      # still fails the job through the exit code.
      - name: Seed demonstration data
        run: python -m scripts.seed_demo > /dev/null
