name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, not a tag: a tag can be moved to
# different code, a commit cannot. Dependabot proposes updates to the pins.
jobs:
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (full history, for secret scanning)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secret scanning over every commit, not just the latest tree. The binary
      # is pinned by version and verified against its published checksum.
      - name: Scan the history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The sandbox probe ships in the image, not the backend package, but it
      # is first-party Python and held to the same rules.
      - name: Lint
        run: python -m ruff check . ../agents/sandbox

      - name: Format check
        run: python -m ruff format --check . ../agents/sandbox

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

  sandbox:
    name: Sandbox isolation (Docker)
    # The only place the isolation guarantees are checked against a real
    # kernel. Everything else asserts what AgentHub asks for; this asserts
    # what a container can actually do.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Turns "no runtime" or "image missing" into a failure rather than a
      # quiet skip, so this job cannot pass without verifying anything.
      AGENTHUB_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the sandbox image
        run: docker build --tag agenthub/sandbox:0.6.0 ../agents/sandbox

      - name: Start real containers and check every isolation guarantee
        run: python -m pytest -m sandbox -rs

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agenthub
          # Throwaway value for an ephemeral CI container that is never exposed
          # outside this job. Not a secret and not used anywhere else.
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://agenthub:ci_local_only@127.0.0.1:5432/agenthub
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      # Fails if the models have drifted away from the migrations.
      - name: Check for un-migrated model changes
        run: python -m alembic check

      - name: Check the migration can be rolled back and reapplied
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      # Output is discarded: the seed prints generated demo passwords, and CI
      # logs are not a place for credentials even throwaway ones. A failure
      # still fails the job through the exit code.
      - name: Seed demonstration data
        run: python -m scripts.seed_demo > /dev/null
